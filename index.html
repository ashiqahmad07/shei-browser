<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shei Browser</title>
<meta name="description" content="A fast, private web browser for Android that blocks ads and trackers.">
<link rel="icon" type="image/png" href="icon-512.png">
<style>
  :root { --bg: #ffffff; --fg: #1b1b1f; --muted: #5d5e66; --accent: #c62828; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #131316; --fg: #e5e5ea; --muted: #a3a4ad; --accent: #ff8a80; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 36rem; margin: 0 auto; padding: 4rem 16px; text-align: center; }
  img { width: 112px; height: 112px; border-radius: 26px; }
  h1 { font-size: 2rem; margin: 1rem 0 .25rem; }
  p { margin: .25rem 0 1rem; color: var(--muted); }
  nav { margin-top: 2rem; display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <img src="icon-512.png" alt="Shei Browser icon">
  <h1>Shei Browser</h1>
  <p>A fast, private web browser for Android. Ads, trackers and cookie pop-ups are blocked from the
  start, and what you browse stays on your phone.</p>
  <nav>
    <a href="privacy/">Privacy policy</a>
    <a href="mailto:info@ashiqahmad.com">Contact</a>
  </nav>
</main>
</body>
</html>
